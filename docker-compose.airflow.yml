services:
  mongo:
    image: mongo:7.0
    container_name: predicao-chuvas-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: predicao-chuvas-airflow
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_DAG_SCHEDULE: "0 5 * * *"
      PROJECT_ROOT: /opt/airflow/project
      PROJECT_PYTHON_BIN: python
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: predicao_chuvas_brasilia
      OPEN_METEO_PREVIOUS_RUNS_URL: https://previous-runs-api.open-meteo.com/v1/forecast
      OPEN_METEO_TIMEOUT_SECONDS: "45"
      OPEN_METEO_MAX_RETRIES: "1"
      _PIP_ADDITIONAL_REQUIREMENTS: "python-dotenv>=1.0,<2.0 Pillow>=10.0,<12.0 python-docx>=1.1,<2.0 pymongo>=4.7,<5.0"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      set -e;
      airflow db migrate;
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname Local
      --role Admin
      --email admin@example.com || true;
      airflow scheduler &
      exec airflow webserver
      "

volumes:
  airflow_logs:
  mongo_data:
