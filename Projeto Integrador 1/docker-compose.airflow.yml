services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: predicao-chuvas-airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_DAG_SCHEDULE: "0 5 * * *"
      PROJECT_ROOT: /opt/airflow/project
      PROJECT_PYTHON_BIN: python
      _PIP_ADDITIONAL_REQUIREMENTS: "python-dotenv>=1.0,<2.0 Pillow>=10.0,<12.0 python-docx>=1.1,<2.0"
    volumes:
      - ./:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname Local
      --role Admin
      --email admin@example.com || true;
      airflow scheduler &
      exec airflow webserver
      "

volumes:
  airflow_logs:

